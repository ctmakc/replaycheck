# x402 paywall in front of the ReplayCheck upstream (src/server.js).
#   mainnet:  npx @celo/buy gate paywall.yml --facilitator <celo x402 facilitator URL>
#   sandbox:  npx @celo/buy --sandbox gate paywall.sandbox.yml --mock
# The caller pays the agent wallet; the agent wallet then pays the buy gateway per browser
# session and per inference call. ReplayCheck keeps the spread.
name: replaycheck
version: 1
network: celo
payTo: "0x7Fd33c597ACd183c3AD9006C1FE8e337609cFCd3"
trustProxy: true
rateLimit:
  scope: ip
  requestsPerMinute: 60
  burst: 10
services:
  replaycheck:
    mode: proxy
    upstream: http://127.0.0.1:8762
    timeoutMs: 600000
    forwardHeaders: [content-type, accept]
endpoints:
  - path: /v1/health
    service: replaycheck
    free: true
    restrictions:
      methods: [GET]
  - path: /reports/*
    service: replaycheck
    free: true
    restrictions:
      methods: [GET]
  - path: /v1/replay
    service: replaycheck
    price: 0.05 USDC
    restrictions:
      methods: [POST]
      maxBodyBytes: 65536
      json: true
      jsonOnlyFields: [tasks]
